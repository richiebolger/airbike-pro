/* ---------- shared animation specs ---------- */
const easeOut600 = { duration: 0.6, ease: "easeOut" };
const rise = (delay = 0) => ({
  initial: { opacity: 0, y: 20 },
  animate: { opacity: 1, y: 0 },
  transition: { ...easeOut600, delay },
});
const riseInView = (delay = 0) => ({
  initial: { opacity: 0, y: 20 },
  whileInView: { opacity: 1, y: 0 },
  viewport: { once: true, amount: 0.25 },
  transition: { ...easeOut600, delay },

/* ---------- Button: hover 1.03x + shadow (200ms), tap 0.98x (150ms) ---------- */
function Btn({ children, href = APP_STORE_URL, secondary = false, className = "" }) {
  return (
    <motion.a
      href={href}
      className={
        "inline-flex items-center gap-2 rounded-full font-semibold px-7 py-3.5 select-none cursor-pointer text-[17px] " +

      }
      initial={false}
      style={secondary ? {} : { boxShadow: "0 6px 24px rgba(255,106,0,0.28)" }}
      whileHover={{
        scale: 1.03,
        boxShadow: secondary ? "0 10px 30px rgba(29,29,31,0.12)" : "0 12px 36px rgba(255,106,0,0.4)",
        transition: { duration: 0.2, ease: "easeOut" },

      whileTap={{ scale: 0.98, transition: { duration: 0.15, ease: "easeOut" } }}
    >
      {children}
    </motion.a>
  );
}

/* ---------- Magnetic nav link (50px proximity, bouncy spring return) ---------- */
function MagneticLink({ href, children }) {
  const ref = useRef(null);
  const x = useMotionValue(0);
  const y = useMotionValue(0);
  const sx = useSpring(x, { stiffness: 320, damping: 12, mass: 0.6 });
  const sy = useSpring(y, { stiffness: 320, damping: 12, mass: 0.6 });

  useEffect(() => {
    const R = 50;
    const onMove = (e) => {
      const el = ref.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
      const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
      if (Math.hypot(dx, dy) < R) {
        x.set((e.clientX - cx) * 0.45);
        y.set((e.clientY - cy) * 0.45);
      } else { x.set(0); y.set(0); }
    };
    window.addEventListener("mousemove", onMove);
    return () => window.removeEventListener("mousemove", onMove);
  }, []);

  return (
    <motion.a ref={ref} href={href} style={{ x: sx, y: sy }}
      className="text-sm text-text2 hover:text-text1 transition-colors px-1 py-1">
      {children}
    </motion.a>
  );
}

/* ---------- ambient: whisper-quiet pastel orbs ---------- */
function Ambient() {
  const orbs = [
    { cls: "w-[480px] h-[480px] bg-orange-100/50", top: "-6%", left: "62%", dur: 26, dy: 50 },
    { cls: "w-[380px] h-[380px] bg-fog", top: "44%", left: "-10%", dur: 30, dy: -60 },
    { cls: "w-[300px] h-[300px] bg-orange-50", top: "78%", left: "70%", dur: 24, dy: 40 },
  ];
  return (
    <div className="fixed inset-0 z-0 pointer-events-none overflow-hidden" aria-hidden="true">
      {orbs.map((o, i) => (
        <motion.div key={i}
          className={"absolute rounded-full blur-3xl " + o.cls}
          style={{ top: o.top, left: o.left }}
          animate={{ y: [0, o.dy, 0] }}
          transition={{ duration: o.dur, repeat: Infinity, ease: "easeInOut" }}
        />
      ))}
    </div>
  );
}

/* ---------- hero screenshot fan — static, real screenshots, gentle
   pointer parallax + idle float. No spinning. ---------- */
const PHONE_FAN_SHOTS = [
  { src: "assets/powercurve.jpg", cap: "Power Curve & Zones" },
  { src: "assets/compare.jpg", cap: "Compare Tests" },
  { src: "assets/readiness.jpg", cap: "Readiness to Train" },
];
// left / right / center-front — front slot always gets scale 1 + no rotation
const PHONE_FAN_SLOTS = [
  { rotate: -9, x: -92, y: 26, scale: 0.86, delay: 0.55 },
  { rotate: 8, x: 92, y: 26, scale: 0.86, delay: 0.62 },
  { rotate: 0, x: 0, y: 0, scale: 1, delay: 0.5 },
];
function shuffled(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function PhoneFan() {
  const stageRef = useRef(null);
  const tiltX = useSpring(useMotionValue(0), { stiffness: 120, damping: 18 });
  const tiltY = useSpring(useMotionValue(0), { stiffness: 120, damping: 18 });

  const onMove = (e) => {
    const r = stageRef.current.getBoundingClientRect();
    tiltY.set(((e.clientX - r.left) / r.width - 0.5) * 10);
    tiltX.set(-((e.clientY - r.top) / r.height - 0.5) * 8);
  };
  const onLeave = () => { tiltX.set(0); tiltY.set(0); };

  // re-shuffled on every mount, so refreshing the page changes which
  // screenshot lands front-and-center
  const [order] = useState(() => shuffled(PHONE_FAN_SHOTS));
  const cards = order.map((shot, i) => ({ ...shot, ...PHONE_FAN_SLOTS[i] }));

  return (
    <div
      ref={stageRef}
      onMouseMove={onMove}
      onMouseLeave={onLeave}
      className="relative w-full flex justify-center"
      style={{ perspective: 1400 }}
    >
      {cards.map((c, i) => (
        <motion.div
          key={c.cap}
          initial={{ opacity: 0, y: 60, scale: c.scale * 0.85, rotate: c.rotate }}
          animate={{ opacity: 1, y: 0, scale: c.scale, rotate: c.rotate }}
          transition={{ duration: 0.7, ease: "easeOut", delay: c.delay }}
          style={{
            position: i === 2 ? "relative" : "absolute",
            top: i === 2 ? "auto" : "50%",
            left: i === 2 ? "auto" : "50%",
            marginTop: i === 2 ? 0 : c.y,
            marginLeft: i === 2 ? 0 : c.x,
            translateX: i === 2 ? "0%" : "-50%",
            translateY: i === 2 ? "0%" : "-50%",
            zIndex: i === 2 ? 2 : 1,
            rotateX: tiltX,
            rotateY: tiltY,
          }}
          whileHover={{ y: -8, transition: { duration: 0.25 } }}
        >
          <motion.div
            animate={{ y: [0, i === 2 ? -10 : -6, 0] }}
            transition={{ duration: 5 + i, repeat: Infinity, ease: "easeInOut", delay: i * 0.4 }}
          >
            <IPhone src={c.src} alt={c.cap} className="w-[min(230px,58vw)]" />
            <div className="text-text2 text-xs font-medium text-center mt-4">{c.cap}</div>
          </motion.div>
        </motion.div>
      ))}
    </div>
  );
}
